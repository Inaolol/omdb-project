<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reel Index — search the OMDb archive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="styles.css">
    <script src="config.js"></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="app" id="app">
      <header class="hero">
        <div class="hero-inner">
          <a class="brand" href="index.html" aria-label="Reel Index — home">
            <div class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 32 32">
                <circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="1"/>
                <circle cx="16" cy="16" r="9" fill="none" stroke="currentColor" stroke-width="1"/>
                <circle cx="16" cy="16" r="3" fill="currentColor"/>
                <circle cx="16" cy="3.5" r="1.4" fill="currentColor"/>
                <circle cx="28.5" cy="16" r="1.4" fill="currentColor"/>
                <circle cx="16" cy="28.5" r="1.4" fill="currentColor"/>
                <circle cx="3.5" cy="16" r="1.4" fill="currentColor"/>
              </svg>
            </div>
            <div class="brand-text">
              <div class="brand-name">REEL INDEX</div>
            </div>
          </a>

          <form class="searchbar" id="search-form" role="search">
            <div class="searchbar-inner">
              <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
                <path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
              <input
                id="movie-query"
                name="q"
                type="search"
                autocomplete="off"
                spellcheck="false"
                placeholder="Search films, series, episodes…"
                aria-label="Search OMDb"
              >
              <button type="button" class="search-clear" id="search-clear" aria-label="Clear search" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                </svg>
              </button>
              <kbd class="kbd-hint" id="kbd-hint" aria-hidden="true">/</kbd>
            </div>
          </form>

          <div class="filters">
            <div class="filter">
              <label>Type</label>
              <div class="seg" role="radiogroup" id="type-seg">
                <button type="button" role="radio" data-value="any" data-on="1">any</button>
                <button type="button" role="radio" data-value="movie" data-on="0">movie</button>
                <button type="button" role="radio" data-value="series" data-on="0">series</button>
                <button type="button" role="radio" data-value="episode" data-on="0">episode</button>
              </div>
            </div>
            <div class="filter">
              <label for="f-year">Year</label>
              <input
                id="f-year"
                type="text"
                inputmode="numeric"
                maxlength="4"
                placeholder="any"
                class="year-input"
              >
            </div>
          </div>

          <div class="recent" id="recent" hidden>
            <div class="recent-label">Recent</div>
            <div class="recent-row" id="recent-row"></div>
          </div>
        </div>
      </header>

      <main class="results" id="results"></main>

      <footer class="foot">
        <span>Data via <a href="https://www.omdbapi.com/" target="_blank" rel="noopener noreferrer">OMDb</a></span>
        <span class="foot-sep">·</span>
        <span>Press <kbd>/</kbd> to search</span>
      </footer>
    </div>

    <div id="overlay-root"></div>
  </body>
</html>
